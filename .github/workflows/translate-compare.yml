# TEMPORARY: remove before merging. Runs the OpenAI translation on a fixed
# sample of strings so it can be compared with the Claude and AWS versions.
name: Translate compare

on:
  pull_request:
    paths:
      - .github/workflows/translate-compare.yml
      - _scripts/translate-compare.ts
      - _scripts/translate-compare-keys.json
      - _scripts/translation/**

jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    environment: develop
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: yarn install --ignore-scripts

      - name: Translate the sample
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: NODE_PATH=./src NODE_ENV=metadata npx vite-node --project metadata/node.tsconfig.json _scripts/translate-compare.ts

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: translate-compare
          path: translate-compare/
