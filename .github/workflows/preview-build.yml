          VITE_WITHDRAW_PET_CONTRACT: "0x787B11842F600495606D4d3F4Df911Df9eecD1e5"
          VITE_DEPOSIT_V2_CONTRACT: "0x180f96d2FF1Be8C49eA10815216873606C3054D0"
          VITE_PET_CONTRACT: "0x03049Ccb68858d5Be158a137BD1e390A6DF63f0A"

          # Placeholders for values the real deploys take from secrets.
          VITE_ALCHEMY_RPC: "<ALCHEMY_RPC>"
          VITE_ALCHEMY_KEY: "<ALCHEMY_KEY>"
          VITE_POKO_API_KEY: "<POKO_API_KEY>"
          VITE_POKO_DIRECT_CHECKOUT_API_KEY: "<POKO_DIRECT_CHECKOUT_API_KEY>"
          VITE_WALLETCONNECT_PROJECT_ID: "<WALLETCONNECT_PROJECT_ID>"
          VITE_SEQUENCE_ACCESS_KEY: "<SEQUENCE_ACCESS_KEY>"
          VITE_FIREBASE_VAPID_KEY: "<FIREBASE_VAPID_KEY>"
          VITE_TWITTER_CLIENT_ID: "<TWITTER_CLIENT_ID>"
          VITE_DONATION_ADDRESS: "0x000000000000000000000000000000000000dEaD"

      # The deploy job trusts nothing in this directory, but keep the artifact
      # honest: static files only, no Workers/Pages control files, no links.
      - name: Strip non-static files
        run: |
          set -euo pipefail
          test -f preview-dist/index.html
          find preview-dist -type l -print -delete
          find preview-dist \( -name '_worker.js' -o -name '_headers' -o -name '_redirects' -o -name '_routes.json' \) -print -delete
          du -sh preview-dist
          echo "files: $(find preview-dist -type f | wc -l)"

      # Which PR this build belongs to. preview-deploy.yml cross-checks every
      # field against the GitHub API before trusting it.
      - name: Write preview metadata
        run: |
          cat <<EOF > preview-meta.json
          {
            "pr": ${{ github.event.pull_request.number }},
            "headSha": "${{ github.event.pull_request.head.sha }}",
            "baseSha": "${{ github.event.pull_request.base.sha }}"
          }
          EOF
          cat preview-meta.json

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: preview-dist
          path: preview-dist
          retention-days: 3
          if-no-files-found: error

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: preview-meta
          path: preview-meta.json
          retention-days: 3
          if-no-files-found: error
