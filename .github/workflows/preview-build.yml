# PR previews, step 1 of 2: build the pull request as an ART_MODE (UI-only)
# site and hand the files to preview-deploy.yml as an artifact.
#
# This runs on `pull_request`, so for fork PRs GitHub strips every secret and
# gives us a read-only token. That is deliberate: the PR's own vite config,
# postinstall scripts and build plugins all execute here, and nothing in this
# job is worth stealing. Deployment happens in preview-deploy.yml, which runs
# from main with secrets and never executes anything from this artifact.
#
# See docs/PR_PREVIEWS.md.
name: Preview build

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: yarn install

      # No VITE_API_URL => ART_MODE: the client never talks to a server, auth
      # starts "connected" and the farm comes from landData.ts (shaped by the
      # ?fixture / ?patch URL params, see src/features/game/lib/preview/).
      # Only public configuration is passed; placeholders stand in for the
      # values testnet.yml takes from secrets.
      - name: Build (ART_MODE, no API)
        run: yarn vite build --outDir preview-dist
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          CI: false

          VITE_NETWORK: amoy
          VITE_CLIENT_VERSION: pr-${{ github.event.pull_request.number }}
          VITE_RELEASE_VERSION: ${{ github.event.pull_request.head.sha }}
          VITE_ROOM_URL: wss://mmo-dev.sunflower-land.com
          VITE_AI_PORTAL_WS_URL: wss://ai-dev.sunflower-land.com
          VITE_PRIVATE_IMAGE_URL: "https://sunflower-land.com/testnet-assets"
          VITE_ANIMATION_URL: "https://animations-dev.sunflower-land.com"
          VITE_DISCORD_REDIRECT: "https://api-dev.sunflower-land.com/oauth/discord"
          VITE_TELEGRAM_BOT: "sunflower_land_testnet_bot"
          VITE_RECAPTCHA_SITEKEY: "6Lfqm6MeAAAAAFS5a0vwAfTGUwnlNoHziyIlOl1s"
          VITE_CLOUDFLARE_CAPTCHA_SITEKEY: "0x4AAAAAAAAoHFfoj3YbRYSO"
          VITE_MOONFORGE_GAME_ID: "a1c35b7b-049b-4662-8a6c-2b0476080671"
