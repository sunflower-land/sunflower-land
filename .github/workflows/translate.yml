name: Translate

on:
  push:
    branches:
      - main
    paths:
      - src/lib/i18n/dictionaries/dictionary.json
  # Manual run to catch up after a failed or cancelled translation.
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-24.04-arm
    environment: develop
    concurrency: testnet-translate
    # id-token lets the job ask GitHub for an identity token, which the
    # translate step exchanges for a short-lived Claude API token. No API key
    # is stored. The checkout and the commit use TRANSLATOR_GITHUB_TOKEN.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRANSLATOR_GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: yarn install

      - name: Configure Git user
        run: |
          git config --global user.name "Translator Bot"
          git config --global user.email "translator@sunflower-land.com"

      # Pull before translating, so the new strings land on top of the latest
      # main and a commit pushed meanwhile can't block the pull.
      - name: Pull latest changes
        run: |
          git fetch origin
          git pull origin main

      - name: Run translation script
        id: translate
        env:
          # These IDs are not secrets. The federation rule only accepts this
          # workflow, on main, in the develop environment.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-identity-token
        run: |
          set -o pipefail

          fetch_identity_token() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -er .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" \
              && mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }

          fetch_identity_token

          # A GitHub identity token lasts about five minutes and can be
          # exchanged once, so keep a fresh one in the file for the SDK to
          # pick up when a long run has to renew its API token.
          (while sleep 60; do fetch_identity_token || true; done) &
          trap "kill $!" EXIT

          yarn translate

      # The script fails the job when a term could not be translated, but it
      # still writes the terms that were. Commit those, so only the missing
      # ones are left for the next run.
      - uses: EndBug/add-and-commit@v9
        if: ${{ !cancelled() && steps.translate.conclusion != 'skipped' }}
        with:
          message: "[BOT] Update translations [skip ci]"
          committer_name: Translator Bot
          committer_email: translator@sunflower-land.com
          add: src/lib/i18n/dictionaries/*.json
          commit: --no-verify
