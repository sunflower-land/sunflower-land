name: Translate

on:
  push:
    branches:
      - main
    paths:
      - src/lib/i18n/dictionaries/dictionary.json
  # Manual run to catch up after a failed or cancelled translation.
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-24.04-arm
    environment: develop
    concurrency: testnet-translate
    # The checkout and the commit use TRANSLATOR_GITHUB_TOKEN.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRANSLATOR_GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: yarn install

      - name: Configure Git user
        run: |
          git config --global user.name "Translator Bot"
          git config --global user.email "translator@sunflower-land.com"

      # Pull before translating, so the new strings land on top of the latest
      # main and a commit pushed meanwhile can't block the pull.
      - name: Pull latest changes
        run: |
          git fetch origin
          git pull origin main

      - name: Run translation script
        id: translate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: yarn translate

      # The script fails the job when a term could not be translated, but it
      # still writes the terms that were. Commit those, so only the missing
      # ones are left for the next run.
      - uses: EndBug/add-and-commit@v9
        if: ${{ !cancelled() && steps.translate.conclusion != 'skipped' }}
        with:
          message: "[BOT] Update translations [skip ci]"
          committer_name: Translator Bot
          committer_email: translator@sunflower-land.com
          add: src/lib/i18n/dictionaries/*.json
          commit: --no-verify
