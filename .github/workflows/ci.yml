name: CI
on:
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install modules
        run: yarn
      - name: Typescript check
        run: yarn tsc
      - name: Run tests
        run: yarn test
        env:
          VITE_NETWORK: amoy
      - name: Run lint
        run: yarn lint

  # The request-token WASM artifact is committed (contributors don't need a
  # Rust toolchain). This job proves the committed binary matches the Rust
  # source: it re-runs the crate's tests, rebuilds with the pinned toolchain,
  # and fails on any byte difference.
  request-token-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Run crate tests
        working-directory: wasm/request-token
        run: cargo test

      - name: Rebuild WASM module
        working-directory: wasm/request-token
        run: |
          wasm-pack build --target web --release --out-dir /tmp/request-token-build --out-name request_token
          rm -f /tmp/request-token-build/.gitignore /tmp/request-token-build/package.json /tmp/request-token-build/README.md

      - name: Verify committed artifact matches source
        run: |
          if ! diff -r src/lib/requestToken/wasm /tmp/request-token-build; then
            echo "::error::Committed WASM artifact differs from wasm/request-token source."
            echo "Rebuild with: cd wasm/request-token && wasm-pack build --target web --release --out-dir ../../src/lib/requestToken/wasm --out-name request_token && rm -f ../../src/lib/requestToken/wasm/{.gitignore,package.json,README.md}"
            exit 1
          fi
