name: PR template
# pull_request_target runs this file and the script as they are on the base
# branch, so a PR (including one from a fork) can't edit the check it's judged
# by. That's safe only because no step checks out or runs the PR's code: the
# PR is read through the API, and its title and body arrive via env.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-template-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    # Bots (Dependabot, translation PRs) and GitHub's "Revert" button PRs
    # don't use the template.
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      !startsWith(github.event.pull_request.title, 'Revert "')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Base branch only. Never check out the PR's head or merge ref here.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: List changed files
        # bash -eo pipefail: a failed or partial `gh api` must fail the step,
        # not leave an empty file list that lets the check pass.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | {filename, patch}' | jq -s . > "${RUNNER_TEMP}/changed-files.json"

      - name: Check the PR follows the template
        env:
          # Passed through env, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          CHANGED_FILES_JSON_PATH: ${{ runner.temp }}/changed-files.json
        run: node .github/scripts/check-pr-template.mjs
