name: Main commit alerts

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  alert:
    environment: develop
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect direct commits and send alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_MAIN_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_MAIN_ALERT_WEBHOOK_URL }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUSH_ACTOR: ${{ github.actor }}
        run: |
          node <<'EOF'
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");

          const ZERO_SHA = "0000000000000000000000000000000000000000";
          const {
            GITHUB_TOKEN,
            OPENAI_API_KEY,
            DISCORD_MAIN_ALERT_WEBHOOK_URL,
            BEFORE_SHA,
            AFTER_SHA,
            REPOSITORY,
            SERVER_URL,
            RUN_URL,
            PUSH_ACTOR,
          } = process.env;

          const [owner, repo] = REPOSITORY.split("/");
          const skippedEmails = new Set([
            "metadata@sunflower-land.com",
            "translator@sunflower-land.com",
          ]);
          const skippedNames = new Set(["Metadata Bot", "Translator Bot"]);

          function appendSummary(lines) {
            if (!process.env.GITHUB_STEP_SUMMARY) {
              return;
            }

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          }

          function git(args, options = {}) {
            return execFileSync("git", args, {
              encoding: "utf8",
              maxBuffer: 1024 * 1024 * 20,
              ...options,
            }).trim();
          }

          function truncate(value, limit) {
            if (!value || value.length <= limit) {
              return value;
            }

            return `${value.slice(0, limit - 3)}...`;
          }

          // Keeps text from pinging anyone or turning into a clickable link.
          function plainText(value) {
            return value.replace(/@/g, "@\u200b").replace(/:\/\//g, ":\u200b//");
          }

          function escapeDiscord(value) {
            return plainText(value).replace(/[`*_~|]/g, "\\$&");
          }

          function getCommitMetadata(sha) {
            const raw = execFileSync(
              "git",
              [
                "show",
                "-s",
                "--format=%H%x00%an%x00%ae%x00%cn%x00%ce%x00%s%x00%B",
                sha,
              ],
              { encoding: "utf8", maxBuffer: 1024 * 1024 * 5 },
            );
            const [commitSha, authorName, authorEmail, committerName, committerEmail, subject, body] =
              raw.split("\0");

            return {
              sha: commitSha.trim(),
              authorName: authorName.trim(),
              authorEmail: authorEmail.trim(),
              committerName: committerName.trim(),
              committerEmail: committerEmail.trim(),
              subject: subject.trim(),
              body: (body || "").trim(),
            };
          }

          function isMergeCommit(sha) {
            return git(["rev-list", "--no-walk", "--parents", sha]).split(" ").length > 2;
          }

          // With a baseSha, cover every commit in baseSha..sha (a rebase merge
          // spreads one PR over several commits). Without one, cover the single
          // commit. firstParent is set only for a PR's merge commit, so its diff is
          // what the PR brought in. Any other merge (say a local `git pull` pushed
          // straight to main) keeps git's default, which shows only what the merge
          // itself changed, not everything main gained since the local branch split.
          function getChangedFiles(sha, { baseSha, firstParent } = {}) {
            const mergeOptions = firstParent ? ["--diff-merges=first-parent"] : [];
            const output = baseSha
              ? git(["diff", "--name-only", baseSha, sha])
              : git(["show", "--name-only", ...mergeOptions, "--format=", sha]);
            return output
              .split("\n")
              .map((line) => line.trim())
              .filter(Boolean);
          }

          function getDiffForSummary(sha, { baseSha, firstParent } = {}) {
            const diffOptions = ["--stat=120,200", "--summary", "--unified=1"];
            if (!baseSha) {
              const mergeOptions = firstParent ? ["--diff-merges=first-parent"] : [];
              return truncate(git(["show", "--format=fuller", ...diffOptions, ...mergeOptions, sha]), 15000);
            }
            // Separate budgets, so a long commit log can't crowd out the patch.
            return [
              truncate(git(["log", "--format=fuller", `${baseSha}..${sha}`]), 3000),
              truncate(git(["diff", ...diffOptions, baseSha, sha]), 12000),
            ].join("\n\n");
          }

          function getCommitUrl(sha) {
            return `${SERVER_URL}/${REPOSITORY}/commit/${sha}`;
          }

          function shouldSkipCommit(metadata) {
            if (
              skippedEmails.has(metadata.authorEmail) ||
              skippedEmails.has(metadata.committerEmail)
            ) {
              return true;
            }

            if (
              skippedNames.has(metadata.authorName) ||
              skippedNames.has(metadata.committerName)
            ) {
              return true;
            }

            return metadata.subject.startsWith("[BOT]");
          }

          async function githubRequest(path) {
            const response = await fetch(`https://api.github.com${path}`, {
              headers: {
                Authorization: `Bearer ${GITHUB_TOKEN}`,
                Accept: "application/vnd.github+json",
                "User-Agent": "main-commit-alerts",
              },
            });

            if (!response.ok) {
              throw new Error(`GitHub REST request failed: ${response.status} ${await response.text()}`);
            }

            return response.json();
          }

          async function githubGraphql(query, variables) {
            const response = await fetch("https://api.github.com/graphql", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${GITHUB_TOKEN}`,
                "Content-Type": "application/json",
                "User-Agent": "main-commit-alerts",
              },
              body: JSON.stringify({ query, variables }),
            });

            const payload = await response.json();

            if (!response.ok || payload.errors) {
              throw new Error(`GitHub GraphQL request failed: ${JSON.stringify(payload.errors || payload)}`);
            }

            return payload.data;
          }

          async function findAssociatedPullRequest(sha, subject) {
            const query = `
              query AssociatedPullRequests($owner: String!, $repo: String!, $sha: GitObjectID!) {
                repository(owner: $owner, name: $repo) {
                  object(oid: $sha) {
                    ... on Commit {
                      associatedPullRequests(first: 5) {
                        nodes {
                          number
                          title
                          url
                          mergedAt
                          baseRefName
                          isCrossRepository
                        }
                      }
                    }
                  }
                }
              }
            `;

            try {
              const data = await githubGraphql(query, { owner, repo, sha });
              const pullRequests =
                data.repository.object?.associatedPullRequests?.nodes?.filter(
                  (pullRequest) => pullRequest.mergedAt && pullRequest.baseRefName === "main",
                ) ?? [];

              if (pullRequests.length > 0) {
                return pullRequests[0];
              }
            } catch (error) {
              console.log(`GraphQL association lookup failed for ${sha}: ${error.message}`);
            }

            const match =
              subject.match(/Merge pull request #(\d+)/) ||
              subject.match(/\(#(\d+)\)\s*$/);

            if (!match) {
              return null;
            }

            try {
              const pullRequest = await githubRequest(`/repos/${owner}/${repo}/pulls/${match[1]}`);
              // The subject alone doesn't prove this commit came from the PR, so
              // require it to be the PR's recorded merge (or squash) commit.
              if (
                pullRequest.merged_at &&
                pullRequest.base?.ref === "main" &&
                pullRequest.merge_commit_sha === sha
              ) {
                return {
                  number: pullRequest.number,
                  title: pullRequest.title,
                  url: pullRequest.html_url,
                  mergedAt: pullRequest.merged_at,
                  baseRefName: pullRequest.base.ref,
                  // A deleted fork leaves `head.repo` null; that still counts as a fork.
                  isCrossRepository: pullRequest.head?.repo?.full_name !== REPOSITORY,
                };
              }
            } catch (error) {
              console.log(`REST fallback lookup failed for PR #${match[1]}: ${error.message}`);
            }

            return null;
          }

          const writeAccessByLogin = new Map();

          async function hasWriteAccess(login) {
            if (!writeAccessByLogin.has(login)) {
              const { permission } = await githubRequest(
                `/repos/${owner}/${repo}/collaborators/${encodeURIComponent(login)}/permission`,
              );
              writeAccessByLogin.set(login, permission === "admin" || permission === "write");
            }
            return writeAccessByLogin.get(login);
          }

          async function isPrApproved(prNumber) {
            try {
              const reviews = await githubRequest(`/repos/${owner}/${repo}/pulls/${prNumber}/reviews?per_page=100`);
              const latestStateByReviewer = new Map();

              for (const review of reviews) {
                if (!review.user) continue;
                const state = review.state;
                if (state === "APPROVED" || state === "CHANGES_REQUESTED" || state === "DISMISSED") {
                  latestStateByReviewer.set(review.user.login, state);
                }
              }

              // Only reviews from people with write access count, as in branch protection.
              const states = [];
              for (const [login, state] of latestStateByReviewer) {
                if (await hasWriteAccess(login)) {
                  states.push(state);
                }
              }
              const hasApproval = states.some((s) => s === "APPROVED");
              const hasChangesRequested = states.some((s) => s === "CHANGES_REQUESTED");

              return hasApproval && !hasChangesRequested;
            } catch (error) {
              console.log(`Review lookup failed for PR #${prNumber}: ${error.message}`);
              // Unknown. Team PRs still alert, since only a confirmed approval skips them.
              return null;
            }
          }

          async function summarizeWithAi(metadata, files, diff) {
            if (!OPENAI_API_KEY) {
              appendSummary([
                "## Main commit alerts",
                "",
                "AI summary skipped because `OPENAI_API_KEY` is not available to this workflow run.",
              ]);
              return { risk: null, summary: null };
            }

            const response = await fetch("https://api.openai.com/v1/responses", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${OPENAI_API_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                model: "gpt-5.6-sol",
                // Reasoning tokens count against this budget, so keep reasoning
                // low and leave room for the summary itself.
                max_output_tokens: 600,
                reasoning: { effort: "low" },
                input: [
                  {
                    role: "system",
                    content:
                      "You summarize git commits for an internal engineering alert. Your first line must be exactly one of: RISK: LOW, RISK: MEDIUM, or RISK: HIGH — based on the scope, sensitivity, and potential impact of the change. Then add 2-4 short markdown bullet points. Be factual, concise, and focus on what changed and likely impact. If the diff looks mechanical or generated, say so. Do not include a heading.",
                  },
                  {
                    role: "user",
                    content: [
                      `Repository: ${REPOSITORY}`,
                      `Commit: ${metadata.sha}`,
                      `Author: ${metadata.authorName} <${metadata.authorEmail}>`,
                      `Subject: ${metadata.subject}`,
                      `Changed files: ${files.join(", ") || "None"}`,
                      "",
                      "Diff:",
                      diff,
                    ].join("\n"),
                  },
                ],
              }),
            });

            if (!response.ok) {
              throw new Error(`OpenAI request failed: ${response.status} ${await response.text()}`);
            }

            const payload = await response.json();
            const summaryText =
              payload.output_text?.trim() ||
              (payload.output ?? [])
                .flatMap((item) => item.content ?? [])
                .filter((item) => item.type === "output_text" && typeof item.text === "string")
                .map((item) => item.text.trim())
                .filter(Boolean)
                .join("\n")
                .trim();

            if (!summaryText) {
              appendSummary([
                "## Main commit alerts",
                "",
                "OpenAI responded, but no summary text could be extracted from the response payload.",
              ]);
              console.log(
                `OpenAI response for ${metadata.sha} did not include extractable text. Top-level keys: ${Object.keys(payload).join(", ")}`,
              );
              return { risk: null, summary: null };
            }

            const riskMatch = summaryText.match(/^RISK:\s*(LOW|MEDIUM|HIGH)\b/i);
            const risk = riskMatch ? riskMatch[1].toUpperCase() : null;
            const cleanedSummary = summaryText.replace(/^RISK:\s*(LOW|MEDIUM|HIGH)\s*/i, "").trim();

            return { risk, summary: cleanedSummary };
          }

          function fallbackSummary(metadata, files) {
            const bullets = [
              `- Commit message: ${metadata.subject}`,
            ];

            if (files.length > 0) {
              bullets.push(`- Changed files: ${truncate(files.join(", "), 250)}`);
            }

            if (metadata.body) {
              bullets.push(`- Commit body: ${truncate(metadata.body.replace(/\s+/g, " "), 250)}`);
            }

            bullets.push("- AI summary unavailable; showing commit metadata instead.");
            return { risk: null, summary: bullets.join("\n") };
          }

          const RISK_COLORS = {
            LOW: 3066993,
            MEDIUM: 16776960,
            HIGH: 15158332,
          };

          async function sendDiscordAlert(metadata, summary, risk, pullRequest) {
            const embedColor = risk ? (RISK_COLORS[risk] ?? 15158332) : 15158332;
            const riskField = {
              name: "Risk Score",
              value: risk || "UNKNOWN",
              inline: true,
            };

            const shouldTagTeam = risk !== "LOW";
            const payload = {
              username: "GitHub Commits Alerts",
              ...(shouldTagTeam && {
                content: "<@&1260758874189729867>",
                allowed_mentions: {
                  roles: ["1260758874189729867"],
                },
              }),
              avatar_url:
                "https://cdn.discordapp.com/avatars/487431320314576937/bd64361e4ba6313d561d54e78c9e7171.png",
              embeds: [
                {
                  title: metadata.community
                    ? "Community PR merged to main"
                    : pullRequest
                      ? "Unapproved PR merge to main detected"
                      : "Direct commit to main detected",
                  url: pullRequest ? pullRequest.url : getCommitUrl(metadata.sha),
                  color: embedColor,
                  description: truncate(plainText(summary), 4000),
                  fields: [
                    riskField,
                    ...(pullRequest
                      ? [
                          {
                            name: "Pull Request",
                            value: `[#${pullRequest.number} - ${escapeDiscord(truncate(pullRequest.title, 100))}](${pullRequest.url})`,
                            inline: true,
                          },
                        ]
                      : []),
                    ...(metadata.community
                      ? [
                          {
                            name: "Approved",
                            value: metadata.approved === null ? "Unknown" : metadata.approved ? "Yes" : "No",
                            inline: true,
                          },
                        ]
                      : []),
                    {
                      name: "Repository",
                      value: escapeDiscord(REPOSITORY),
                      inline: true,
                    },
                    {
                      name: "Commit",
                      value: `[\`${metadata.sha.slice(0, 7)}\`](${getCommitUrl(metadata.sha)})`,
                      inline: true,
                    },
                    {
                      name: "Author",
                      value: escapeDiscord(`${metadata.authorName} <${metadata.authorEmail}>`),
                      inline: true,
                    },
                    {
                      name: "Pushed by",
                      value: escapeDiscord(PUSH_ACTOR),
                      inline: true,
                    },
                    {
                      name: "Workflow run",
                      value: `[Open run](${RUN_URL})`,
                      inline: true,
                    },
                    {
                      name: "Message",
                      value: escapeDiscord(truncate(metadata.subject, 1024)),
                    },
                  ],
                  footer: {
                    text: "Alerts on direct commits, unapproved PR merges and community PR merges to main.",
                  },
                  timestamp: new Date().toISOString(),
                },
              ],
            };

            const response = await fetch(DISCORD_MAIN_ALERT_WEBHOOK_URL, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });

            if (!response.ok) {
              throw new Error(`Discord webhook failed: ${response.status} ${await response.text()}`);
            }
          }

          async function main() {
            if (!DISCORD_MAIN_ALERT_WEBHOOK_URL) {
              appendSummary([
                "## Main commit alerts",
                "",
                "Skipped notification because `DISCORD_MAIN_ALERT_WEBHOOK_URL` is not configured yet.",
              ]);
              return;
            }

            const commitRange =
              !BEFORE_SHA || BEFORE_SHA === ZERO_SHA
                ? [AFTER_SHA]
                : git(["rev-list", "--reverse", "--topo-order", `${BEFORE_SHA}..${AFTER_SHA}`])
                    .split("\n")
                    .filter(Boolean);

            const suspiciousCommits = [];
            const firstShaByPr = new Map();
            const lastShaByPr = new Map();
            const approvalByPr = new Map();
            let skippedBots = 0;

            for (const sha of commitRange) {
              const metadata = getCommitMetadata(sha);
              const pullRequest = await findAssociatedPullRequest(sha, metadata.subject);

              // Note where each PR starts and ends before any filtering, so a
              // rebase summary covers every commit even if the first or last is
              // a bot's.
              if (pullRequest) {
                if (!firstShaByPr.has(pullRequest.number)) {
                  firstShaByPr.set(pullRequest.number, sha);
                }
                lastShaByPr.set(pullRequest.number, sha);
              }

              // Bot commits are skipped, but a community PR always alerts.
              if (!pullRequest?.isCrossRepository && shouldSkipCommit(metadata)) {
                skippedBots += 1;
                continue;
              }

              if (pullRequest) {
                // Check once per PR, so every commit of a PR gets the same answer.
                if (!approvalByPr.has(pullRequest.number)) {
                  approvalByPr.set(pullRequest.number, await isPrApproved(pullRequest.number));
                }
                const approved = approvalByPr.get(pullRequest.number);
                // Community PRs come from forks. Alert on every one that
                // lands, approved or not, however it was merged.
                if (pullRequest.isCrossRepository) {
                  suspiciousCommits.push({ ...metadata, pullRequest, community: true, approved });
                  continue;
                }
                if (approved) {
                  continue;
                }
                suspiciousCommits.push({ ...metadata, pullRequest });
              } else {
                suspiciousCommits.push(metadata);
              }
            }

            // A merge-commit or rebase merge pushes every commit of the PR, and
            // each one resolves to the same PR. Alert once per PR, on its last
            // commit (the merge commit, or the final rebased commit).
            const lastIndexByPr = new Map();
            suspiciousCommits.forEach((commit, index) => {
              if (commit.pullRequest) {
                lastIndexByPr.set(commit.pullRequest.number, index);
              }
            });
            const alerts = suspiciousCommits
              .filter(
                (commit, index) =>
                  !commit.pullRequest || lastIndexByPr.get(commit.pullRequest.number) === index,
              )
              .map((commit) => {
                // A rebase merge: summarise all of the PR's commits, not just the
                // last. A merge commit's first-parent diff already covers them.
                if (!commit.pullRequest) {
                  return commit;
                }
                if (isMergeCommit(commit.sha)) {
                  return { ...commit, firstParent: true };
                }
                const firstSha = firstShaByPr.get(commit.pullRequest.number);
                const lastSha = lastShaByPr.get(commit.pullRequest.number);
                if (firstSha === lastSha) {
                  return commit;
                }
                // lastSha can be a later bot commit that the filter dropped.
                return { ...commit, baseSha: `${firstSha}^`, headSha: lastSha };
              });

            appendSummary([
              "## Main commit alerts",
              "",
              `Processed ${commitRange.length} commit(s).`,
              `Skipped ${skippedBots} known bot commit(s).`,
              `Flagged ${alerts.length} change(s) to \`main\`, ${alerts.filter((commit) => commit.community).length} of them from community PRs.`,
            ]);

            let failedAlerts = 0;
            for (const metadata of alerts) {
              // A huge patch can overflow git's output buffer. Send the alert
              // with whatever was collected rather than dropping it.
              let files = [];
              let diff = "";
              try {
                files = getChangedFiles(metadata.headSha ?? metadata.sha, metadata);
                diff = getDiffForSummary(metadata.headSha ?? metadata.sha, metadata);
              } catch (error) {
                console.log(`Diff collection failed for ${metadata.sha}: ${error.message}`);
              }

              let result;
              try {
                result = await summarizeWithAi(metadata, files, diff);
              } catch (error) {
                console.log(`AI summary failed for ${metadata.sha}: ${error.message}`);
              }

              if (!result || !result.summary) {
                result = fallbackSummary(metadata, files);
              }

              // One rejected alert shouldn't drop the rest of the push.
              try {
                await sendDiscordAlert(metadata, result.summary, result.risk, metadata.pullRequest);
              } catch (error) {
                console.error(`Discord alert failed for ${metadata.sha}: ${error.message}`);
                failedAlerts += 1;
              }
            }

            if (failedAlerts > 0) {
              throw new Error(`${failedAlerts} Discord alert(s) failed to send.`);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF
