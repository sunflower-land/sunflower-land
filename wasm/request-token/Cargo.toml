[package]
name = "request-token"
version = "0.1.0"
edition = "2021"
description = "Per-session request token computation for the Sunflower Land client"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
hmac = "0.12"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
